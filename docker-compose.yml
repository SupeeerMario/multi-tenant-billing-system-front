services:
  build:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm ci && npm run build"
    profiles: [build]

  frontend:
    image: nginx:1.29-alpine
    ports:
      - "8090:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default, backend]
    restart: unless-stopped

networks:
  backend:
    name: khaled_default
    external: true
